<svg xmlns="http://www.w3.org/2000/svg" width="210" height="280" viewBox="0 0 210 280"><rect width="210" height="280" fill="#f9faf7"/><path d="M209 18V262" stroke="#dce0d6"/><text x="14" y="34" fill="#b94424" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">THE APPROACH</text><g fill="#23231f" font-family="Arial,sans-serif" font-size="12"><text x="14" y="64">Pre-med turned computer</text><text x="14" y="84">scientist. Drawn to making</text><text x="14" y="104">things work.</text><text x="14" y="124"></text><text x="14" y="144">Understand the constraint.</text><text x="14" y="164">Compare tradeoffs. Build a</text><text x="14" y="184">practical path to delivery.</text><text x="14" y="204"></text><text x="14" y="224">Full-stack, applied AI,</text><text x="14" y="244">automation, and teaching.</text></g></svg>