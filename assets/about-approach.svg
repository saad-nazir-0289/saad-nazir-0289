<svg xmlns="http://www.w3.org/2000/svg" width="280" height="268" viewBox="0 0 280 268"><rect width="280" height="268" fill="#f9faf7"/><path d="M279 18V250" stroke="#dce0d6"/><text x="20" y="36" fill="#b94424" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">THE APPROACH</text><g fill="#23231f" font-family="Arial,sans-serif" font-size="13"><text x="20" y="68">Pre-med turned computer scientist.</text><text x="20" y="89">Drawn to making things work.</text><text x="20" y="110"></text><text x="20" y="131">Understand the business constraint.</text><text x="20" y="152">Compare tradeoffs. Build a practical</text><text x="20" y="173">path to delivery.</text><text x="20" y="194"></text><text x="20" y="215">Full-stack development, applied AI,</text><text x="20" y="236">automation, and teaching.</text></g></svg>