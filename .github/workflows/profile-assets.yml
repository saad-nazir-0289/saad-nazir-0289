name: Validate profile README assets

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "M. Saad Nazir CV 2026 (2).pdf"
      - "scripts/check_profile_assets.py"
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate local README references
        run: python scripts/check_profile_assets.py
