name: Validate profile artwork builder

on:
  pull_request:
    paths:
      - "scripts/design/**"
      - ".github/workflows/design-builder.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/design/**"
      - ".github/workflows/design-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/design/requirements.txt
      - name: Install pinned artwork dependencies
        run: python -m pip install -r scripts/design/requirements.txt
      - name: Check builder imports and CLI
        run: python scripts/design/build.py --help
